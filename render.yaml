services:
  - type: web
    name: artemisa-backend
    plan: starter
    runtime: docker
    repo: https://github.com/VECTORG99/Artemisa
    dockerfilePath: ./docker/Dockerfile.backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: AUTH_REQUIRED
        value: 'true'
      - key: ARTEMISA_API_KEYS
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://artemisa.vercel.app'
      - key: BYPASS_SECRET
        generateValue: true
      - key: METRICS_SECRET
        generateValue: true
