<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="glass-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00381e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  
  <!-- Tarjeta de vidrio -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="url(#glass-grad-green)" stroke="#00ff87" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="58" y="58" width="396" height="396" rx="38" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Cubos e Integridad (SHA-256) -->
  <g stroke="#00ff87" stroke-width="3" fill="none" stroke-linejoin="round" filter="url(#glow-green)">
    <!-- Cubo Superior -->
    <path d="M 256 140 L 310 170 L 256 200 L 202 170 Z" />
    <path d="M 202 170 L 202 220 L 256 250 L 256 200" />
    <path d="M 310 170 L 310 220 L 256 250" />

    <!-- Etiqueta Hash SHA-256 -->
    <rect x="186" y="270" width="140" height="36" rx="8" fill="#000000" stroke="#00ff87" stroke-width="2"/>
    <text x="256" y="293" font-family="monospace" font-size="16" font-weight="bold" fill="#00ff87" text-anchor="middle" stroke="none">SHA-256</text>

    <!-- Cubo Inferior Reproducido -->
    <path d="M 256 330 L 310 360 L 256 390 L 202 360 Z" />
    <path d="M 202 360 L 202 400 L 256 430 L 256 390" />
    <path d="M 310 360 L 310 400 L 256 430" />

    <!-- Badge de Verificación -->
    <circle cx="360" cy="360" r="20" fill="#000000" stroke="#00ff87" stroke-width="2"/>
    <path d="M 350 360 L 357 367 L 370 352" stroke="#00ff87" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
