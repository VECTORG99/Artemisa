<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor para el efecto de neón/vidrio -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="glass-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#003B46" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  
  <!-- Tarjeta de vidrio -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="url(#glass-grad-blue)" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="58" y="58" width="396" height="396" rx="38" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Estructura Árbol / Red Neural -->
  <g stroke="#00d2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-blue)">
    <!-- Conexiones principales -->
    <path d="M 256 120 L 256 220" />
    <path d="M 256 220 C 256 280, 160 260, 160 320" fill="none"/>
    <path d="M 256 220 C 256 280, 352 260, 352 320" fill="none"/>
    <path d="M 160 320 L 120 380" />
    <path d="M 160 320 L 200 380" />
    <path d="M 352 320 L 312 380" />
    <path d="M 352 320 L 392 380" />

    <!-- Nodos -->
    <circle cx="256" cy="120" r="10" fill="#00d2ff" />
    <circle cx="256" cy="220" r="8" fill="#00d2ff" />
    <circle cx="160" cy="320" r="8" fill="#00d2ff" />
    <circle cx="352" cy="320" r="8" fill="#00d2ff" />
    <circle cx="120" cy="380" r="6" fill="#00d2ff" />
    <circle cx="200" cy="380" r="6" fill="#00d2ff" />
    <circle cx="312" cy="380" r="6" fill="#00d2ff" />
    <circle cx="392" cy="380" r="6" fill="#00d2ff" />
  </g>
</svg>
