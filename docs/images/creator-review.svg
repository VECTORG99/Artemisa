<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="820" height="500" fill="#09090b" rx="12"/>

  <!-- Stars -->
  <circle cx="60" cy="25" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="180" cy="12" r="0.8" fill="#ffffff" opacity="0.2"/>
  <circle cx="420" cy="30" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="18" r="0.7" fill="#ffffff" opacity="0.2"/>
  <circle cx="800" cy="35" r="0.9" fill="#ffffff" opacity="0.25"/>

  <!-- Header -->
  <text x="30" y="38" fill="#f4f4f5" font-size="18" font-weight="700">Revisión antes de generar</text>
  <text x="30" y="58" fill="#71717a" font-size="12">Revisa tus decisiones y recomendaciones. Cada respuesta es editable.</text>

  <!-- Progress bar (complete) -->
  <rect x="30" y="70" width="760" height="3" rx="1.5" fill="#27272a"/>
  <rect x="30" y="70" width="760" height="3" rx="1.5" fill="#dc2626"/>
  <text x="30" y="85" fill="#71717a" font-size="10">100% · Completado</text>

  <!-- LEFT column: Answers summary -->
  <rect x="30" y="95" width="365" height="310" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="46" y="118" fill="#a1a1aa" font-size="10" font-weight="600" letter-spacing="1">RESPUESTAS</text>

  <!-- Answer rows -->
  <text x="46" y="141" fill="#52525b" font-size="10">Nombre</text>
  <text x="46" y="157" fill="#e4e4e7" font-size="12" font-weight="500">Frontend Quality Guardian</text>
  <line x1="46" y1="166" x2="379" y2="166" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="182" fill="#52525b" font-size="10">Propósito</text>
  <text x="46" y="198" fill="#e4e4e7" font-size="12" font-weight="500">Revisión de pull requests</text>
  <line x1="46" y1="207" x2="379" y2="207" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="223" fill="#52525b" font-size="10">Stack</text>
  <text x="46" y="239" fill="#e4e4e7" font-size="12" font-weight="500">TypeScript · React · Next.js · PostgreSQL</text>
  <line x1="46" y1="248" x2="379" y2="248" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="264" fill="#52525b" font-size="10">Arquitectura</text>
  <text x="46" y="280" fill="#e4e4e7" font-size="12" font-weight="500">Monolito modular</text>
  <line x1="46" y1="289" x2="379" y2="289" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="305" fill="#52525b" font-size="10">Entorno</text>
  <text x="46" y="321" fill="#e4e4e7" font-size="12" font-weight="500">Desarrollo · Docker Compose</text>
  <line x1="46" y1="330" x2="379" y2="330" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="346" fill="#52525b" font-size="10">Targets</text>
  <rect x="46" y="352" width="54" height="18" rx="9" fill="#27272a"/>
  <text x="73" y="365" text-anchor="middle" fill="#e4e4e7" font-size="10">Artemisa</text>
  <rect x="106" y="352" width="32" height="18" rx="9" fill="#27272a"/>
  <text x="122" y="365" text-anchor="middle" fill="#e4e4e7" font-size="10">Kiro</text>
  <rect x="144" y="352" width="56" height="18" rx="9" fill="#27272a"/>
  <text x="172" y="365" text-anchor="middle" fill="#e4e4e7" font-size="10">Portable</text>
  <line x1="46" y1="378" x2="379" y2="378" stroke="#27272a" stroke-width="1"/>

  <text x="46" y="394" fill="#52525b" font-size="10">Capacidades</text>
  <text x="46" y="410" fill="#e4e4e7" font-size="11">leer repositorio · editar código · tests · PR review</text>

  <!-- RIGHT column: Recommendations -->
  <rect x="410" y="95" width="380" height="310" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="426" y="118" fill="#a1a1aa" font-size="10" font-weight="600" letter-spacing="1">RECOMENDACIONES</text>

  <!-- Recommendation 1 - recommended -->
  <rect x="426" y="128" width="348" height="82" rx="8" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1"/>
  <rect x="426" y="128" width="4" height="82" rx="2" fill="#2563eb"/>
  <rect x="436" y="137" width="72" height="16" rx="8" fill="#1e3a5f"/>
  <text x="472" y="149" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600">recomendado</text>
  <text x="436" y="168" fill="#e4e4e7" font-size="12" font-weight="600">PR review: control humano del merge</text>
  <text x="436" y="184" fill="#71717a" font-size="10">Un agente que comenta pero no hace merge mantiene el</text>
  <text x="436" y="197" fill="#71717a" font-size="10">equipo en control sin perder velocidad de revisión.</text>
  <text x="762" y="168" text-anchor="end" fill="#52525b" font-size="10">↓ ver detalle</text>

  <!-- Recommendation 2 - warning -->
  <rect x="426" y="220" width="348" height="82" rx="8" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1"/>
  <rect x="426" y="220" width="4" height="82" rx="2" fill="#d97706"/>
  <rect x="436" y="229" width="46" height="16" rx="8" fill="#3d2a10"/>
  <text x="459" y="241" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">warning</text>
  <text x="436" y="260" fill="#e4e4e7" font-size="12" font-weight="600">Kiro: hooks y skills separados</text>
  <text x="436" y="276" fill="#71717a" font-size="10">Kiro separa steering, hooks y skills en archivos</text>
  <text x="436" y="289" fill="#71717a" font-size="10">independientes — revisa antes de aplicar.</text>
  <text x="762" y="260" text-anchor="end" fill="#52525b" font-size="10">↓ ver detalle</text>

  <!-- Recommendation 3 - info -->
  <rect x="426" y="312" width="348" height="80" rx="8" fill="#1c1c1e" stroke="#27272a" stroke-width="1" opacity="0.8"/>
  <rect x="426" y="312" width="4" height="80" rx="2" fill="#6b7280"/>
  <rect x="436" y="321" width="32" height="16" rx="8" fill="#27272a"/>
  <text x="452" y="333" text-anchor="middle" fill="#9ca3af" font-size="9" font-weight="600">info</text>
  <text x="436" y="352" fill="#e4e4e7" font-size="12" font-weight="600">RAG: fuentes acotadas al repositorio</text>
  <text x="436" y="368" fill="#71717a" font-size="10">En desarrollo, limitar las fuentes RAG al workspace</text>
  <text x="436" y="381" fill="#71717a" font-size="10">reduce ruido y mejora precisión.</text>

  <!-- Warnings section -->
  <rect x="30" y="418" width="760" height="32" rx="8" fill="#1c1500" stroke="#854d0e" stroke-width="1"/>
  <text x="46" y="438" fill="#fbbf24" font-size="11">⚠  Fija versiones exactas de los paquetes MCP antes de usar el bundle fuera de una demo.</text>

  <!-- Bottom action -->
  <line x1="30" y1="460" x2="790" y2="460" stroke="#27272a" stroke-width="1"/>
  <rect x="30" y="470" width="90" height="22" rx="6" fill="transparent" stroke="#3f3f46" stroke-width="1"/>
  <text x="75" y="486" text-anchor="middle" fill="#a1a1aa" font-size="11">← Editar</text>

  <rect x="598" y="468" width="192" height="26" rx="8" fill="#dc2626"/>
  <text x="694" y="486" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Generar bundle →</text>
</svg>
