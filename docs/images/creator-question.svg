<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="820" height="480" fill="#09090b" rx="12"/>

  <!-- Stars background -->
  <circle cx="45" cy="30" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="15" r="0.8" fill="#ffffff" opacity="0.2"/>
  <circle cx="200" cy="45" r="1.2" fill="#ffffff" opacity="0.35"/>
  <circle cx="350" cy="20" r="0.7" fill="#ffffff" opacity="0.25"/>
  <circle cx="500" cy="35" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="10" r="0.8" fill="#ffffff" opacity="0.2"/>
  <circle cx="750" cy="40" r="1.1" fill="#ffffff" opacity="0.3"/>
  <circle cx="780" cy="18" r="0.7" fill="#ffffff" opacity="0.2"/>
  <circle cx="30" cy="100" r="0.9" fill="#ffffff" opacity="0.15"/>
  <circle cx="790" cy="120" r="0.8" fill="#ffffff" opacity="0.2"/>
  <circle cx="810" cy="80" r="0.6" fill="#ffffff" opacity="0.15"/>

  <!-- Progress bar -->
  <rect x="30" y="20" width="760" height="4" rx="2" fill="#27272a"/>
  <rect x="30" y="20" width="304" height="4" rx="2" fill="#dc2626"/>
  <!-- Progress label -->
  <text x="30" y="12" fill="#71717a" font-size="10">Objetivo</text>
  <text x="790" y="12" text-anchor="end" fill="#71717a" font-size="10">40%</text>

  <!-- Section badge -->
  <rect x="30" y="42" width="68" height="20" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="64" y="56" text-anchor="middle" fill="#a1a1aa" font-size="10" font-weight="500">Objetivo</text>

  <!-- Question -->
  <text x="30" y="90" fill="#f4f4f5" font-size="20" font-weight="700">¿Qué problema principal resolverá?</text>
  <text x="30" y="112" fill="#71717a" font-size="13">La finalidad abre ramas y recomendaciones especializadas.</text>

  <!-- Options grid -->
  <!-- Row 1 -->
  <rect x="30" y="132" width="225" height="64" rx="8" fill="#18181b" stroke="#dc2626" stroke-width="1.5"/>
  <text x="52" y="156" fill="#f4f4f5" font-size="13" font-weight="600">Revisión de pull requests</text>
  <text x="52" y="175" fill="#71717a" font-size="11">Analiza cambios, riesgos y estándares</text>
  <text x="52" y="189" fill="#71717a" font-size="11">antes de integrar.</text>
  <!-- Selected indicator -->
  <circle cx="43" cy="156" r="5" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="43" cy="156" r="2.5" fill="#dc2626"/>

  <rect x="270" y="132" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="292" y="156" fill="#f4f4f5" font-size="13" font-weight="600">Desarrollo y mantenimiento</text>
  <text x="292" y="175" fill="#71717a" font-size="11">Ayuda a implementar, refactorizar</text>
  <text x="292" y="189" fill="#71717a" font-size="11">y corregir código.</text>
  <circle cx="283" cy="156" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <rect x="510" y="132" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="532" y="156" fill="#f4f4f5" font-size="13" font-weight="600">Pruebas y calidad</text>
  <text x="532" y="175" fill="#71717a" font-size="11">Diseña pruebas, quality gates</text>
  <text x="532" y="189" fill="#71717a" font-size="11">y validaciones.</text>
  <circle cx="523" cy="156" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <!-- Row 2 -->
  <rect x="30" y="210" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="52" y="234" fill="#f4f4f5" font-size="13" font-weight="600">DevOps y plataforma</text>
  <text x="52" y="253" fill="#71717a" font-size="11">Automatiza CI/CD, infraestructura</text>
  <text x="52" y="267" fill="#71717a" font-size="11">y operación.</text>
  <circle cx="43" cy="234" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <rect x="270" y="210" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="292" y="234" fill="#f4f4f5" font-size="13" font-weight="600">Seguridad</text>
  <text x="292" y="253" fill="#71717a" font-size="11">Revisa código, dependencias,</text>
  <text x="292" y="267" fill="#71717a" font-size="11">configuración y amenazas.</text>
  <circle cx="283" cy="234" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <rect x="510" y="210" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="532" y="234" fill="#f4f4f5" font-size="13" font-weight="600">Datos e IA</text>
  <text x="532" y="253" fill="#71717a" font-size="11">Pipelines, modelos, RAG</text>
  <text x="532" y="267" fill="#71717a" font-size="11">y calidad de datos.</text>
  <circle cx="523" cy="234" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <!-- Row 3 -->
  <rect x="30" y="288" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="52" y="312" fill="#f4f4f5" font-size="13" font-weight="600">Operación de producción</text>
  <text x="52" y="331" fill="#71717a" font-size="11">Diagnóstico, observabilidad</text>
  <text x="52" y="345" fill="#71717a" font-size="11">y respuesta guiada.</text>
  <circle cx="43" cy="312" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <rect x="270" y="288" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="292" y="312" fill="#f4f4f5" font-size="13" font-weight="600">Documentación</text>
  <text x="292" y="331" fill="#71717a" font-size="11">Mantiene documentación técnica</text>
  <text x="292" y="345" fill="#71717a" font-size="11">y runbooks.</text>
  <circle cx="283" cy="312" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <rect x="510" y="288" width="225" height="64" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="532" y="312" fill="#f4f4f5" font-size="13" font-weight="600">Investigación</text>
  <text x="532" y="331" fill="#71717a" font-size="11">Exploración, prototipado</text>
  <text x="532" y="345" fill="#71717a" font-size="11">y experimentación.</text>
  <circle cx="523" cy="312" r="5" fill="none" stroke="#52525b" stroke-width="1.5"/>

  <!-- Bottom navigation -->
  <line x1="30" y1="378" x2="790" y2="378" stroke="#27272a" stroke-width="1"/>

  <!-- Back button -->
  <rect x="30" y="392" width="90" height="38" rx="8" fill="transparent" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="75" y="416" text-anchor="middle" fill="#a1a1aa" font-size="13">← Atrás</text>

  <!-- Continue button -->
  <rect x="656" y="392" width="134" height="38" rx="8" fill="#dc2626" stroke="none"/>
  <text x="723" y="416" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Continuar →</text>

  <!-- Mode label -->
  <rect x="340" y="396" width="100" height="30" rx="6" fill="#1c1c1e" stroke="#27272a" stroke-width="1"/>
  <text x="390" y="416" text-anchor="middle" fill="#52525b" font-size="10">Auto-largo</text>

  <!-- Question counter -->
  <text x="410" y="450" text-anchor="middle" fill="#3f3f46" font-size="11">Pregunta 2 de 26 · Sección Objetivo</text>
</svg>
