[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented here.\n"
body = """
{% if version %}\n## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}\n
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**[BREAKING]** {% endif %}{{ commit.message | upper_first }}{% if commit.pr_number %} ([#{{ commit.pr_number }}](https://github.com/VECTORG99/Artemisa/pull/{{ commit.pr_number }})){% endif %}{% if commit.scope %} _({{ commit.scope }})_{% endif %}
{% endfor %}
{% endfor %}\n
"""
footer = "\n<!-- generated by git-cliff -->\n"
trim = true

[git]
conventional_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^style", group = "Style" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build" },
  { message = ".*", group = "Other", default_scope = "other" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"
