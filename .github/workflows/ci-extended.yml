name: CI Extended

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: cp .env.example .env
      - name: Run tests with coverage
        run: npx c8 --reporter=text --reporter=lcov npm run test:unit
        continue-on-error: true
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()

  e2e:
    # Playwright lives in ci-extended (not ci.yml) so it does not add browser
    # download + Next build to every PR (issue #712). It is the only coverage
    # that exercises the Creator flow against a live backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build frontend
        # NEXT_PUBLIC_* is inlined at build time, so the API URL has to point at
        # the local backend here, not at run time.
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - name: Start backend
        run: |
          AUTH_REQUIRED=false PORT=3001 npm run start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 30s"
          cat /tmp/backend.log
          exit 1
      - name: Run Playwright e2e
        # playwright.config.ts starts `next start` on :3000 when CI is set.
        run: npm --prefix frontend run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Backend log
        if: failure()
        run: cat /tmp/backend.log || true

  docker-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          tags: artemisa-backend:test
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          # Build context must be the repo root — docker/Dockerfile.frontend
          # copies frontend/package.json and packages/types (monorepo
          # workspaces), not just the frontend/ subdirectory.
          context: .
          file: docker/Dockerfile.frontend
          tags: artemisa-frontend:test
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
        continue-on-error: true
      - name: Build agent-creator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent-creator
          tags: artemisa-creator:test
          load: true
          cache-from: type=gha,scope=agent-creator
          cache-to: type=gha,mode=max,scope=agent-creator
        continue-on-error: true
      - name: Verify backend starts
        run: |
          docker run -d --name test-backend -e AUTH_REQUIRED=false -p 3001:3001 artemisa-backend:test
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start within 30s"
          docker logs test-backend
          exit 1
