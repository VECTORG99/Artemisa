name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Format check
        run: npx prettier --check .
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: cp .env.example .env
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm's legacy quick-audit endpoint (/-/npm/v1/security/audits/quick)
      # has been retired server-side; older npm CLI versions still call it
      # and get errors unrelated to this repo's dependencies. Newer npm only
      # uses the bulk advisory endpoint. Upgrade npm itself, not the audit
      # command or its blocking behavior.
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=critical
