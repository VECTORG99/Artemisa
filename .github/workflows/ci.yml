name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit
      - name: Format check
        run: npx prettier --check .
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Unit tests (shard ${{ matrix.shard }}/3)
        run: |
          files=$(ls test/*.test.mjs | awk "NR % 3 == ${{ matrix.shard }} - 1")
          node --import tsx/esm --test --test-concurrency=4 $files
      - name: Integration tests
        if: matrix.shard == 1
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # npm's legacy quick-audit endpoint (/-/npm/v1/security/audits/quick)
      # has been retired server-side; older npm CLI versions still call it
      # and get errors unrelated to this repo's dependencies. Newer npm only
      # uses the bulk advisory endpoint. Upgrade npm itself, not the audit
      # command or its blocking behavior.
      - name: Update npm
        run: npm install -g npm@latest
      - name: Audit dependencies (with retry)
        run: |
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "::group::npm audit attempt $attempt/$max_attempts"
            set +e
            output=$(npm audit --audit-level=critical 2>&1)
            exit_code=$?
            set -e
            echo "$output"
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              echo "✓ npm audit passed"
              exit 0
            fi

            # Check if failure is due to registry/network errors (not real vulnerabilities)
            if echo "$output" | grep -qiE '(ECONNREFUSED|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|fetch failed|request to .* failed|429|503|registry error|Unexpected token|Unexpected end of JSON)'; then
              echo "::warning::npm audit attempt $attempt failed due to registry/network error"
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 10s..."
                sleep 10
              fi
            else
              # Real vulnerability findings — fail immediately
              echo "::error::npm audit found critical vulnerabilities"
              exit $exit_code
            fi
          done

          # All retries exhausted due to registry errors
          echo "::warning title=npm audit skipped::All $max_attempts attempts failed due to npm registry errors (possible brownout). Audit was not evaluated — review manually."
          exit 0
