name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Get next version
        id: version
        run: |
          NEXT_VERSION=$(git-cliff --bumped-version)
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      - name: Update package.json version
        run: |
          node -e "
          const pkg = JSON.parse(require('fs').readFileSync('./package.json', 'utf-8'));
          pkg.version = '${{ steps.version.outputs.version }}';
          require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD --tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "$(git-cliff --latest --strip header)"
