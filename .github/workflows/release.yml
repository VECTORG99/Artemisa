name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Check if tag already exists
        id: check_tag
        run: |
          git fetch --tags --force
          RAW_VERSION=$(git-cliff --config .github/cliff.toml --bumped-version)
          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG="v$CLEAN_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          if git tag -l | grep -q "^$TAG$"; then
            echo "Tag $TAG already exists — skipping release (circular trigger)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit if tag exists
        if: steps.check_tag.outputs.skip == 'true'
        run: exit 0

      - run: npm ci
      - run: npm run build

      - name: Get next version
        id: version
        run: |
          echo "tag=${{ steps.check_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.check_tag.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG.md
        run: git-cliff --config .github/cliff.toml -o docs/CHANGELOG.md

      - name: Update package.json version
        run: |
          node -e "
          const pkg = JSON.parse(require('fs').readFileSync('./package.json', 'utf-8'));
          pkg.version = '${{ steps.version.outputs.version }}';
          require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md package.json
          git diff --cached --quiet || git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD --tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "$(git-cliff --config .github/cliff.toml --latest --strip header)"
